[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geometric-bridge"
version = "0.1.0"
description = "Unified integration layer for geometric intelligence ecosystem"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.20", "scipy>=1.7"]

[project.urls]
Homepage = "https://github.com/JinnZ2/geometric-to-binary/geometric-bridge"
